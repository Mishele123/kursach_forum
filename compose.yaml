name: velo
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velo
      POSTGRES_USER: velo
      POSTGRES_PASSWORD: ${VELO_POSTGRES_PASSWORD:-velo_local}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velo -d velo"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://velo:${VELO_POSTGRES_PASSWORD:-velo_local}@postgres:5432/velo
      REDIS_URL: redis://redis:6379/0
      VELO_UPLOAD_DIR: /app/uploads
      VELO_COOKIE_SECURE: ${VELO_COOKIE_SECURE:-0}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      VELO_TEST_DATABASE_URL: postgresql+asyncpg://velo:${VELO_POSTGRES_PASSWORD:-velo_local}@postgres:5432/velo_test
      VELO_TEST_REDIS_URL: redis://redis:6379/15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
