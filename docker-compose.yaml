name: "kursach"

services:
  postgres:
    image: postgres:18-alpine
    container_name: kursach-postgres
    environment:
        POSTGRES_HOST: $POSTGRES_HOST
        POSTGRES_USER: $POSTGRES_USER
        POSTGRES_PASSWORD: $POSTGRES_PASSWORD
        POSTGRES_DB: $POSTGRES_DB
        TZ: ${TZ:-Europe/Moscow}
        PGTZ: ${PGTZ:-Europe/Moscow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
        - app_network

  redis:
    image: redis:8-alpine
    container_name: kursach-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
        - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge
